<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tag de imagem</title>
  </head>
  <body>
    <h1>tag de imagem</h1>

    <!--igm= imagem
     src = source (origem da imagem)
     alt altenartiva-->
    <figure>
      <img
        src="../imagens/shibuya.avif "
        alt="shibuya"
        width="400"
        height="400"
        title="centro de shibuya de cima"
      />
      <figcaption>centro de shibuya de cima\</figcaption>
    </figure>
  </body>
</html>
