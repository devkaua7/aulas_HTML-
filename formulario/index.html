<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario</title>
  </head>
  <body>
    <h1>Formulário HTML</h1>

    <hr />

    <!-- colacar o nome -->
    <form>
      <label for="nome">Nome:</label>
      <input type="text" name="" id="nome" placeholder="Ex: Roberto Carlos" />
      <br /><br />

      <!-- colocar email -->
      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        name=""
        placeholder="exemplo@exemplo.com.br"
      />
      <br />
      <br />

      <!--  colocar senhas  -->
      <label for="senha">senha</label>
      <input
        type="password"
        name=""
        id="senha"
        password="Digite sua senha"
      /><br /><br />

      <!-- selecione seu generos  -->
      <label for="">Gênero: </label><br />

      <!-- genero masculino  -->
      <input type="radio" name="genero" id="masculino" value="masculino" />
      <label for="">Maculino</label><br />

      <!-- genero Feminino -->
      <input type="radio" name="genero" id="Feminino" value="Feminino" />
      <label for="">Feminino</label><br />

      <!-- outros generos  -->
      <input type="radio" name="genero" id="outros" value="Outros" />
      <label for="">Outros</label><br />

      <button type="submit">Enviar</button>
    </form>
  </body>
</html>
