<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LIstas ordenadas e não ordenadas</title>
  </head>
  <body>
    <!-- ul-> unordered list(lista não ordenadas)
    ol -> ordered list (listas ordenadas)
    li -> list item (item de lista)-->

    <ul>
      <li>casa</li>
      <li>banheiro</li>
      <li>
        Cozinha
        <ul>
          <li>panela</li>
          <li>fogão</li>
          <li>pratos</li>
        </ul>
        <ol type="I">
          <li>Banana</li>
          <li>Maçã</li>
          <li>uva</li>
        </ol>
      </li>
    </ul>
  </body>
</html>
